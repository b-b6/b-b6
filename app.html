<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#06141B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pwa-icon-192.png">
    <title>Barber SaaS — Выбор роли</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/db.js"></script>
    <script src="assets/mobile-bridge.js"></script>
    <script src="barbershops_kg.js"></script>

    <style>
        :root {
            --bg-deep: #06141B;
            --panel-bg: #11212D;
            --card-bg: #253745;
            --border-col: #4A5C6A;
            --text-light: #CCD0CF;
            --text-white: #FFFFFF;
            --text-muted: #9BA8AB;
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 0%, #11212D 0%, #06141B 70%);
            color: var(--text-white);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px 32px;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            margin: auto 0;
            animation: fadeIn 0.35s ease;
        }

        @media (max-height: 760px) {
            html, body {
                padding: 14px 14px 24px;
            }
            .brand-header {
                margin-bottom: 18px;
            }
            .brand-logo {
                width: 52px;
                height: 52px;
                border-radius: 16px;
                margin-bottom: 8px;
            }
            .brand-logo svg {
                width: 26px;
                height: 26px;
            }
            .brand-header h1 {
                font-size: 1.55rem;
                margin-bottom: 4px;
            }
            .brand-header p {
                font-size: 0.84rem;
                line-height: 1.35;
            }
            .role-cards {
                gap: 10px;
            }
            .role-card {
                padding: 13px 15px;
                border-radius: 16px;
                gap: 13px;
            }
            .role-icon {
                width: 46px;
                height: 46px;
                border-radius: 13px;
            }
            .role-icon svg {
                width: 22px;
                height: 22px;
            }
            .role-title {
                font-size: 1.02rem;
            }
            .role-desc {
                font-size: 0.77rem;
                line-height: 1.3;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, #253745 0%, #11212D 100%);
            border: 1.5px solid var(--gold);
            box-shadow: 0 12px 32px rgba(251, 191, 36, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--gold);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .brand-header h1 {
            font-family: var(--font-display);
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-white);
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.45;
        }

        /* ── 3 ROLE CARDS ── */
        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .role-card {
            background: linear-gradient(145deg, var(--card-bg) 0%, var(--panel-bg) 100%);
            border: 1.5px solid var(--border-col);
            border-radius: 20px;
            padding: 20px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: left;
            width: 100%;
            color: var(--text-white);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .role-card:hover, .role-card:active {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(251, 191, 36, 0.16);
        }

        .role-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .role-info {
            flex: 1;
            min-width: 0;
        }

        .role-title {
            font-family: var(--font-display);
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.18);
            color: var(--gold);
        }

        .role-desc {
            font-size: 0.83rem;
            color: var(--text-light);
            line-height: 1.4;
            font-weight: 500;
        }

        .role-arrow {
            color: var(--gold);
            flex-shrink: 0;
        }

        /* ── MODALS FOR OWNER & SOLO MASTER AUTH ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 20, 27, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1.5px solid var(--border-col);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 26px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            max-height: 90dvh;
            overflow-y: auto;
        }

        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-top h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-col);
            color: var(--text-light);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .inp {
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            background: var(--bg-deep);
            border: 1.5px solid var(--border-col);
            color: var(--text-white);
            font-family: var(--font-sans);
            font-size: 0.94rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .inp:focus {
            border-color: var(--gold);
        }

        .shop-search-results {
            max-height: 165px;
            overflow-y: auto;
            background: var(--bg-deep);
            border: 1px solid var(--border-col);
            border-radius: 12px;
            margin-top: 6px;
            display: none;
        }

        .shop-search-item {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(74, 92, 106, 0.35);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .shop-search-item:hover {
            background: var(--card-bg);
        }

        .btn-gold {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #06141B;
            font-family: var(--font-display);
            font-size: 0.96rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.28);
        }

        .err-msg {
            color: var(--danger);
            font-size: 0.84rem;
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .gps-status-toast {
            margin-top: 18px;
            text-align: center;
            font-size: 0.84rem;
            color: var(--gold);
            font-weight: 600;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-header">
            <div class="brand-logo">
                <i data-lucide="scissors" style="width:34px;height:34px;"></i>
            </div>
            <div class="brand-badge">Multi-Tenant Barber SaaS</div>
            <h1>BarberMap & Booking</h1>
            <p>Единая платформа онлайн-записи и управления барбершопами Кыргызстана</p>
        </div>

        <!-- 3 ROLE SELECTION BUTTONS -->
        <div class="role-cards">
            <!-- 1. КЛИЕНТ -->
            <button type="button" class="role-card" onclick="handleClientRole()">
                <div class="role-icon">
                    <i data-lucide="map-pin" style="width:28px;height:28px;"></i>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Я Клиент
                        <span class="role-tag">401+ салонов</span>
                    </div>
                    <div class="role-desc">Интерактивная карта всех барбершопов Кыргызстана, поиск рядом по GPS и онлайн-запись</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>

            <!-- 2. ВЛАДЕЛЕЦ БАРБЕРШОПА -->
            <button type="button" class="role-card" onclick="openOwnerModal()">
                <div class="role-icon">
                    <i data-lucide="bar-chart-3" style="width:28px;height:28px;"></i>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Владелец барбершопа
                        <span class="role-tag">Салон / CRM</span>
                    </div>
                    <div class="role-desc">Полная панель управления салоном: мастера, сетка записей, аналитика, склад, QR и геометка</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>

            <!-- 3. Я МАСТЕР (СОЛО) -->
            <button type="button" class="role-card" onclick="openMasterModal()">
                <div class="role-icon">
                    <i data-lucide="armchair" style="width:28px;height:28px;"></i>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Я Мастер
                        <span class="role-tag">Соло-кабинет</span>
                    </div>
                    <div class="role-desc">Личное расписание на день, автоподсчет заработка по %, личный статус, услуги и свой QR-код</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>
        </div>

        <div class="gps-status-toast" id="gps-toast"></div>
    </div>

    <!-- ══════════ MODAL 1: ВЛАДЕЛЕЦ БАРБЕРШОПА ══════════ -->
    <div class="modal-overlay" id="owner-modal">
        <div class="modal-box">
            <div class="modal-top">
                <h2><i data-lucide="building-2" style="width:22px;height:22px;"></i> Вход для Владельца</h2>
                <button type="button" class="close-btn" onclick="closeRoleModals()"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
            </div>

            <div class="form-group">
                <label>🔍 Быстрый поиск своего барбершопа (по названию или городу)</label>
                <input type="text" id="owner-shop-search" class="inp" placeholder="Напр.: Beton, Marshal, Бишкек, Ош..." oninput="searchBarbershopForOwner(this.value)">
                <div class="shop-search-results" id="owner-search-results"></div>
            </div>

            <div class="form-group">
                <label>ID филиала или Логин владельца</label>
                <input type="text" id="owner-id-input" class="inp" placeholder="Напр.: admin, shine_barbershop или ID с карты">
            </div>

            <div class="form-group">
                <label>Пароль / PIN владельца</label>
                <input type="password" id="owner-pin-input" class="inp" placeholder="Введите PIN (по умолчанию 7777)">
            </div>

            <button type="button" class="btn-gold" onclick="submitOwnerLogin()">
                Войти в панель салона <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
            </button>
            <div class="err-msg" id="owner-err">Неверный ID или PIN-код</div>
        </div>
    </div>

    <!-- ══════════ MODAL 2: Я МАСТЕР (СОЛО-МАСТЕР) ══════════ -->
    <div class="modal-overlay" id="master-modal">
        <div class="modal-box">
            <div class="modal-top">
                <h2><i data-lucide="scissors" style="width:22px;height:22px;"></i> Кабинет Мастера</h2>
                <button type="button" class="close-btn" onclick="closeRoleModals()"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
            </div>

            <div class="form-group">
                <label>ID Мастера (ваш уникальный код)</label>
                <input type="text" id="solo-id-input" class="inp" placeholder="Напр.: master_azamat или solo_1">
            </div>

            <div class="form-group">
                <label>Ваше имя (отображается клиентам)</label>
                <input type="text" id="solo-name-input" class="inp" placeholder="Напр.: Азамат (Топ-Барбер)">
            </div>

            <div class="form-group">
                <label>4-значный PIN-код</label>
                <input type="password" id="solo-pin-input" class="inp" maxlength="8" placeholder="•••• (по умолчанию 7777)">
            </div>

            <button type="button" class="btn-gold" onclick="submitMasterLogin()">
                Открыть личный кабинет <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
            </button>
            <div class="err-msg" id="solo-err">Введите ID мастера и верный 4-значный PIN (например 7777)</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. AUTO-CHECK DEFERRED DEEP LINK & SAVED SESSION ON LAUNCH
        (function initLaunchRouting() {
            const params = new URLSearchParams(window.location.search);

            // A. Check Deferred Deep Link first (Scenario A & B)
            const deferredId = window.BarberMobileBridge.consumeDeferredDeepLink();
            if (deferredId) {
                window.location.replace(`index.html?id=${encodeURIComponent(deferredId)}`);
                return;
            }

            // B. Check Saved Owner / Master Session (skip 3 buttons automatically on subsequent launches)
            if (!params.get('logged_out') && !params.get('switch_role')) {
                const session = window.BarberMobileBridge.getSession();
                if (session && session.tenantId) {
                    if (session.role === 'owner') {
                        window.location.replace(`admin.html?id=${encodeURIComponent(session.tenantId)}`);
                        return;
                    } else if (session.role === 'master') {
                        window.location.replace(`barber.html?id=${encodeURIComponent(session.tenantId)}`);
                        return;
                    }
                }
            }
        })();

        // 2. ROLE 1: CLIENT (Requests GPS ONLY on this button!)
        function handleClientRole() {
            const toast = document.getElementById('gps-toast');
            toast.textContent = '📍 Запрос разрешения на геолокацию (GPS)...';
            window.BarberMobileBridge.requestClientLocation((res) => {
                if (res && res.granted && res.lat && res.lon) {
                    window.location.href = `barbermap_kg.html?gps=1&lat=${res.lat}&lon=${res.lon}`;
                } else {
                    window.location.href = `barbermap_kg.html?gps=0`;
                }
            });
        }

        // 3. ROLE 2: OWNER MODAL & SEARCH
        let selectedOwnerShopName = '';
        function openOwnerModal() {
            document.getElementById('owner-modal').classList.add('active');
            document.getElementById('owner-err').style.display = 'none';
        }

        function openMasterModal() {
            document.getElementById('master-modal').classList.add('active');
            document.getElementById('solo-err').style.display = 'none';
        }

        function closeRoleModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function searchBarbershopForOwner(query) {
            const box = document.getElementById('owner-search-results');
            const q = (query || '').trim().toLowerCase();
            if (q.length < 2) {
                box.style.display = 'none';
                return;
            }
            const catalog = window.BARBERSHOPS_DATA || [];
            const matches = catalog.filter(b =>
                (b.name && b.name.toLowerCase().includes(q)) ||
                (b.city && b.city.toLowerCase().includes(q)) ||
                (b.address && b.address.toLowerCase().includes(q))
            ).slice(0, 12);

            if (matches.length === 0) {
                box.innerHTML = `<div style="padding:10px 12px;color:var(--text-muted);font-size:0.82rem;">Ничего не найдено — введите свой ID ниже</div>`;
                box.style.display = 'block';
                return;
            }

            box.innerHTML = matches.map(b => `
                <div class="shop-search-item" onclick="selectShopForOwner('${b.id.replace(/'/g, '')}', '${(b.name || '').replace(/'/g, '')}')">
                    <div>
                        <div style="font-weight:700;font-size:0.88rem;color:#fff;">${b.name}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);">${b.city || ''} • ${b.address || ''}</div>
                    </div>
                    <span style="font-size:0.75rem;color:var(--gold);font-weight:700;">Выбрать →</span>
                </div>
            `).join('');
            box.style.display = 'block';
        }

        function selectShopForOwner(id, name) {
            document.getElementById('owner-id-input').value = id;
            document.getElementById('owner-shop-search').value = name;
            selectedOwnerShopName = name;
            document.getElementById('owner-search-results').style.display = 'none';
            document.getElementById('owner-pin-input').focus();
        }

        async function submitOwnerLogin() {
            const rawId = document.getElementById('owner-id-input').value.trim();
            const pin = document.getElementById('owner-pin-input').value.trim();
            const errEl = document.getElementById('owner-err');

            if (!rawId || !pin) {
                errEl.textContent = 'Введите ID филиала и PIN-код';
                errEl.style.display = 'block';
                return;
            }

            let matchedTenant = null;
            try {
                if (window.appDB && window.appDB.getGlobalTenants) {
                    const tenants = await window.appDB.getGlobalTenants();
                    matchedTenant = tenants.find(t => (t.id === rawId || t.email === rawId) && t.pin === pin);
                }
            } catch (e) {}

            // Built-in accounts & catalog barbershops with PIN 7777
            if (!matchedTenant && pin === '7777') {
                if (rawId === 'admin' || rawId === 'admin@barber.uz') {
                    matchedTenant = { id: 'markazibarbershop1', shopName: 'Главный Барбершоп' };
                } else if (rawId === 'shine' || rawId === 'shine_barbershop') {
                    matchedTenant = { id: 'shine_barbershop', shopName: 'Shine Barbershop' };
                } else {
                    const fromCatalog = (window.BARBERSHOPS_DATA || []).find(b => b.id === rawId);
                    matchedTenant = {
                        id: rawId.replace(/\s+/g, '_'),
                        shopName: selectedOwnerShopName || (fromCatalog ? fromCatalog.name : rawId)
                    };
                }
            }

            if (!matchedTenant) {
                errEl.textContent = 'Неверный ID или PIN-код (по умолчанию: 7777)';
                errEl.style.display = 'block';
                return;
            }

            // Save shopName in tenant settings if selected from catalog
            if (matchedTenant.shopName) {
                const sKey = matchedTenant.id + '_barber_settings';
                try {
                    const cur = JSON.parse(localStorage.getItem(sKey) || '{}');
                    if (!cur.shopName) {
                        cur.shopName = matchedTenant.shopName;
                        localStorage.setItem(sKey, JSON.stringify(cur));
                    }
                } catch (e) {}
            }

            // Save persistent session (no GPS requested!)
            window.BarberMobileBridge.saveSession({
                role: 'owner',
                tenantId: matchedTenant.id,
                shopName: matchedTenant.shopName
            });

            window.location.href = `admin.html?id=${encodeURIComponent(matchedTenant.id)}`;
        }

        // 4. ROLE 3: SOLO MASTER LOGIN
        function submitMasterLogin() {
            const rawId = document.getElementById('solo-id-input').value.trim().toLowerCase().replace(/\s+/g, '_');
            const masterName = document.getElementById('solo-name-input').value.trim() || 'Топ-Мастер';
            const pin = document.getElementById('solo-pin-input').value.trim();
            const errEl = document.getElementById('solo-err');

            if (!rawId || pin.length < 4) {
                errEl.style.display = 'block';
                return;
            }

            // Check saved PIN for this solo master or allow default 7777 / first-time PIN setup
            const pinKey = `solo_pin_${rawId}`;
            const savedPin = localStorage.getItem(pinKey);
            if (savedPin && savedPin !== pin && pin !== '7777') {
                errEl.textContent = 'Неверный PIN-код для этого ID мастера!';
                errEl.style.display = 'block';
                return;
            }
            if (!savedPin) {
                localStorage.setItem(pinKey, pin);
            }

            window.BarberMobileBridge.saveSession({
                role: 'master',
                tenantId: rawId,
                masterId: rawId,
                masterName: masterName,
                shopName: masterName
            });

            window.location.href = `barber.html?id=${encodeURIComponent(rawId)}`;
        }
    </script>
</body>
</html>
