<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pwa-icon-192.png">
    <title>BarberMap KG — Выбор роли</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/db.js?v=6"></script>
    <script src="assets/mobile-bridge.js?v=6"></script>
    <script src="barbershops_kg.js"></script>

    <style>
        :root {
            --navy: #0c192c;
            --navy-light: #182b45;
            --navy-soft: #f0f4f9;
            --navy-line: #d5e2f0;
            --burgundy: #7a1c2d;
            --burgundy-dark: #5c1220;
            --burgundy-light: #962438;
            --burgundy-soft: #fbf0f2;
            --burgundy-line: #f0cdd3;
            --ink: var(--navy);
            --ink2: #243348;
            --muted: #6c7a8e;
            --line: #e6ecf2;
            --soft: #f5f7fa;
            --bg: #ffffff;
            --green: #00873d;
            --green-bg: #ebf7f0;
            --red: #c13515;
            --red-bg: #fdf0ed;
            --sh: 0 6px 24px rgba(12, 25, 44, .08), 0 1px 3px rgba(12, 25, 44, .05);
            --sh-lg: 0 14px 44px rgba(12, 25, 44, .14), 0 2px 8px rgba(12, 25, 44, .06);
            --ease: cubic-bezier(.2, .8, .2, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100dvh;
            background: #e9ecef;
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: var(--sh-lg);
            border: 1px solid rgba(12, 25, 44, .05);
            padding: 24px 22px 26px;
            animation: fadeIn 0.28s var(--ease);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -.03em;
            text-decoration: none;
            color: var(--navy);
        }

        .logo .mk {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--navy);
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 3px 10px rgba(12, 25, 44, .22);
        }

        .logo .map-word {
            color: var(--burgundy);
        }

        .logo .tag {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--burgundy-soft);
            color: var(--burgundy);
            border: 1px solid var(--burgundy-line);
            letter-spacing: .04em;
        }

        .status-open-pill {
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            color: var(--green);
            background: var(--green-bg);
        }

        .brand-header {
            text-align: left;
            margin-bottom: 20px;
        }

        .brand-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--navy);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .brand-header p {
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.45;
        }

        /* ── 3 ROLE CARDS ── */
        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .role-card {
            background: #ffffff;
            border: 1.5px solid var(--line);
            border-radius: 18px;
            padding: 16px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.18s var(--ease);
            text-align: left;
            width: 100%;
            color: var(--navy);
            position: relative;
        }

        .role-card:hover, .role-card:active {
            background: var(--navy-soft);
            border-color: var(--navy-line);
            transform: translateY(-1px);
            box-shadow: var(--sh);
        }

        .role-card.primary-role {
            border-color: var(--burgundy-line);
            background: linear-gradient(to right, #ffffff, var(--burgundy-soft));
        }

        .role-card.primary-role:hover {
            border-color: var(--burgundy);
            box-shadow: 0 6px 20px rgba(122, 28, 45, .12);
        }

        .role-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: var(--navy);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(12, 25, 44, .18);
            position: relative;
        }

        .role-card.primary-role .role-icon {
            background: var(--burgundy);
            box-shadow: 0 4px 14px rgba(122, 28, 45, .28);
        }

        .role-icon .dot-open {
            position: absolute;
            right: -2px;
            bottom: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--green);
            border: 2px solid #fff;
        }

        .role-info {
            flex: 1;
            min-width: 0;
        }

        .role-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--navy);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .role-card:hover .role-title {
            color: var(--burgundy);
        }

        .role-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--burgundy-soft);
            color: var(--burgundy);
            border: 1px solid var(--burgundy-line);
        }

        .role-tag.navy-tag {
            background: var(--navy-soft);
            color: var(--navy);
            border-color: var(--navy-line);
        }

        .role-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.38;
            font-weight: 400;
        }

        .role-arrow {
            color: var(--muted);
            flex-shrink: 0;
            transition: transform 0.15s, color 0.15s;
        }

        .role-card:hover .role-arrow {
            color: var(--burgundy);
            transform: translateX(2px);
        }

        /* ── MODALS FOR OWNER & SOLO MASTER AUTH ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 25, 44, 0.42);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 24px 22px;
            box-shadow: var(--sh-lg);
            max-height: 90dvh;
            overflow-y: auto;
        }

        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .modal-top h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }

        .modal-top h2 svg {
            color: var(--burgundy);
        }

        .close-btn {
            background: var(--navy-soft);
            border: 1px solid var(--navy-line);
            color: var(--navy);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }

        .close-btn:hover {
            background: var(--burgundy-soft);
            color: var(--burgundy);
            border-color: var(--burgundy-line);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .inp {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--soft);
            border: 1.5px solid var(--line);
            color: var(--navy);
            font-family: var(--font-sans);
            font-size: 14.5px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .inp:focus {
            background: #ffffff;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(12, 25, 44, .06);
        }

        .shop-search-results {
            max-height: 170px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-top: 6px;
            box-shadow: var(--sh);
            display: none;
        }

        .shop-search-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: background 0.12s;
        }

        .shop-search-item:hover {
            background: var(--navy-soft);
        }

        .btn-gold {
            width: 100%;
            height: 46px;
            padding: 0 20px;
            border-radius: 14px;
            border: none;
            background: var(--burgundy);
            color: #ffffff;
            font-family: var(--font-sans);
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            box-shadow: 0 4px 14px rgba(122, 28, 45, .28);
            transition: background 0.15s, transform 0.1s;
        }

        .btn-gold:hover {
            background: var(--burgundy-dark);
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        .err-msg {
            color: var(--red);
            background: var(--red-bg);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .gps-status-toast {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: var(--burgundy);
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-row-top">
            <a class="logo" href="barbermap_kg.html">
                <span class="mk">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>
                </span>
                Barber<span class="map-word">Map</span><span class="tag">KG</span>
            </a>
            <span class="status-open-pill">● 401 барбершоп</span>
        </div>

        <div class="brand-header">
            <h1>Выберите вашу роль</h1>
            <p>Единая платформа поиска барбершопов, онлайн-записи и управления салонами Кыргызстана</p>
        </div>

        <!-- 3 ROLE SELECTION BUTTONS -->
        <div class="role-cards">
            <!-- 1. КЛИЕНТ -->
            <button type="button" class="role-card primary-role" onclick="handleClientRole()">
                <div class="role-icon">
                    <i data-lucide="map-pin" style="width:24px;height:24px;"></i>
                    <span class="dot-open"></span>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Я Клиент
                        <span class="role-tag">Записаться</span>
                    </div>
                    <div class="role-desc">Интерактивная карта 401 барбершопа КР, поиск рядом по GPS и онлайн-бронь</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>

            <!-- 2. ВЛАДЕЛЕЦ БАРБЕРШОПА -->
            <button type="button" class="role-card" onclick="openOwnerModal()">
                <div class="role-icon">
                    <i data-lucide="bar-chart-3" style="width:24px;height:24px;"></i>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Владелец барбершопа
                        <span class="role-tag navy-tag">Салон / CRM</span>
                    </div>
                    <div class="role-desc">Панель управления салоном: мастера, расписание, выручка, склад, QR и точка на карте</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>

            <!-- 3. Я МАСТЕР (СОЛО) -->
            <button type="button" class="role-card" onclick="openMasterModal()">
                <div class="role-icon">
                    <i data-lucide="scissors" style="width:24px;height:24px;"></i>
                </div>
                <div class="role-info">
                    <div class="role-title">
                        Я Мастер
                        <span class="role-tag navy-tag">Соло-кабинет</span>
                    </div>
                    <div class="role-desc">Личное расписание в 1 колонку, автоподсчет заработка по %, свои услуги и личный QR</div>
                </div>
                <i data-lucide="chevron-right" class="role-arrow"></i>
            </button>
        </div>

        <div class="gps-status-toast" id="gps-toast"></div>
    </div>

    <!-- ══════════ MODAL 1: ВЛАДЕЛЕЦ БАРБЕРШОПА ══════════ -->
    <div class="modal-overlay" id="owner-modal">
        <div class="modal-box">
            <div class="modal-top">
                <h2><i data-lucide="building-2" style="width:22px;height:22px;"></i> Вход для Владельца</h2>
                <button type="button" class="close-btn" onclick="closeRoleModals()"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
            </div>

            <div class="form-group">
                <label>🔍 Быстрый поиск своего барбершопа (по названию или городу)</label>
                <input type="text" id="owner-shop-search" class="inp" placeholder="Напр.: Beton, Marshal, Бишкек, Ош..." oninput="searchBarbershopForOwner(this.value)">
                <div class="shop-search-results" id="owner-search-results"></div>
            </div>

            <div class="form-group">
                <label>ID филиала или Логин владельца</label>
                <input type="text" id="owner-id-input" class="inp" placeholder="Напр.: admin, shine_barbershop или ID с карты">
            </div>

            <div class="form-group">
                <label>Пароль / PIN владельца</label>
                <input type="password" id="owner-pin-input" class="inp" placeholder="Введите PIN (по умолчанию 7777)">
            </div>

            <button type="button" class="btn-gold" onclick="submitOwnerLogin()">
                Войти в панель салона <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
            </button>
            <div class="err-msg" id="owner-err">Неверный ID или PIN-код</div>
        </div>
    </div>

    <!-- ══════════ MODAL 2: Я МАСТЕР (СОЛО-МАСТЕР) ══════════ -->
    <div class="modal-overlay" id="master-modal">
        <div class="modal-box">
            <div class="modal-top">
                <h2><i data-lucide="scissors" style="width:22px;height:22px;"></i> Кабинет Мастера</h2>
                <button type="button" class="close-btn" onclick="closeRoleModals()"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
            </div>

            <div class="form-group">
                <label>ID Мастера (ваш уникальный код)</label>
                <input type="text" id="solo-id-input" class="inp" placeholder="Напр.: master_azamat или solo_1">
            </div>

            <div class="form-group">
                <label>Ваше имя (отображается клиентам)</label>
                <input type="text" id="solo-name-input" class="inp" placeholder="Напр.: Азамат (Топ-Барбер)">
            </div>

            <div class="form-group">
                <label>4-значный PIN-код</label>
                <input type="password" id="solo-pin-input" class="inp" maxlength="8" placeholder="•••• (по умолчанию 7777)">
            </div>

            <button type="button" class="btn-gold" onclick="submitMasterLogin()">
                Открыть личный кабинет <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
            </button>
            <div class="err-msg" id="solo-err">Введите ID мастера и верный 4-значный PIN (например 7777)</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. AUTO-CHECK DEFERRED DEEP LINK & SAVED SESSION ON LAUNCH
        (function initLaunchRouting() {
            const params = new URLSearchParams(window.location.search);

            // A. Check Deferred Deep Link first (Scenario A & B)
            const deferredId = window.BarberMobileBridge.consumeDeferredDeepLink();
            if (deferredId) {
                window.location.replace(`index.html?id=${encodeURIComponent(deferredId)}`);
                return;
            }

            // B. Check Saved Owner / Master Session (skip 3 buttons automatically on subsequent launches)
            if (!params.get('logged_out') && !params.get('switch_role')) {
                const session = window.BarberMobileBridge.getSession();
                if (session && session.tenantId) {
                    if (session.role === 'owner') {
                        window.location.replace(`admin.html?id=${encodeURIComponent(session.tenantId)}`);
                        return;
                    } else if (session.role === 'master') {
                        window.location.replace(`barber.html?id=${encodeURIComponent(session.tenantId)}`);
                        return;
                    }
                }
            }
        })();

        // 2. ROLE 1: CLIENT (Requests GPS ONLY on this button!)
        function handleClientRole() {
            const toast = document.getElementById('gps-toast');
            toast.textContent = '📍 Запрос разрешения на геолокацию (GPS)...';
            window.BarberMobileBridge.requestClientLocation((res) => {
                if (res && res.granted && res.lat && res.lon) {
                    window.location.href = `barbermap_kg.html?gps=1&lat=${res.lat}&lon=${res.lon}`;
                } else {
                    window.location.href = `barbermap_kg.html?gps=0`;
                }
            });
        }

        // 3. ROLE 2: OWNER MODAL & SEARCH
        let selectedOwnerShopName = '';
        function openOwnerModal() {
            document.getElementById('owner-modal').classList.add('active');
            document.getElementById('owner-err').style.display = 'none';
        }

        function openMasterModal() {
            document.getElementById('master-modal').classList.add('active');
            document.getElementById('solo-err').style.display = 'none';
        }

        function closeRoleModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function searchBarbershopForOwner(query) {
            const box = document.getElementById('owner-search-results');
            const q = (query || '').trim().toLowerCase();
            if (q.length < 2) {
                box.style.display = 'none';
                return;
            }
            const catalog = window.BARBERSHOPS_DATA || [];
            const matches = catalog.filter(b =>
                (b.name && b.name.toLowerCase().includes(q)) ||
                (b.city && b.city.toLowerCase().includes(q)) ||
                (b.address && b.address.toLowerCase().includes(q))
            ).slice(0, 12);

            if (matches.length === 0) {
                box.innerHTML = `<div style="padding:10px 12px;color:var(--muted);font-size:0.82rem;">Ничего не найдено — введите свой ID ниже</div>`;
                box.style.display = 'block';
                return;
            }

            box.innerHTML = matches.map(b => `
                <div class="shop-search-item" onclick="selectShopForOwner('${b.id.replace(/'/g, '')}', '${(b.name || '').replace(/'/g, '')}')">
                    <div>
                        <div style="font-weight:700;font-size:0.88rem;color:var(--navy);">${b.name}</div>
                        <div style="font-size:0.75rem;color:var(--muted);">${b.city || ''} • ${b.address || ''}</div>
                    </div>
                    <span style="font-size:0.75rem;color:var(--burgundy);font-weight:700;">Выбрать →</span>
                </div>
            `).join('');
            box.style.display = 'block';
        }

        function selectShopForOwner(id, name) {
            document.getElementById('owner-id-input').value = id;
            document.getElementById('owner-shop-search').value = name;
            selectedOwnerShopName = name;
            document.getElementById('owner-search-results').style.display = 'none';
            document.getElementById('owner-pin-input').focus();
        }

        async function submitOwnerLogin() {
            const rawId = document.getElementById('owner-id-input').value.trim();
            const pin = document.getElementById('owner-pin-input').value.trim();
            const errEl = document.getElementById('owner-err');

            if (!rawId || !pin) {
                errEl.textContent = 'Введите ID филиала и PIN-код';
                errEl.style.display = 'block';
                return;
            }

            let matchedTenant = null;
            try {
                if (window.appDB && window.appDB.getGlobalTenants) {
                    const tenants = await window.appDB.getGlobalTenants();
                    matchedTenant = tenants.find(t => (t.id === rawId || t.email === rawId) && t.pin === pin);
                }
            } catch (e) {}

            // Built-in accounts & catalog barbershops with PIN 7777
            if (!matchedTenant && pin === '7777') {
                if (rawId === 'admin' || rawId === 'admin@barber.uz') {
                    matchedTenant = { id: 'markazibarbershop1', shopName: 'Главный Барбершоп' };
                } else if (rawId === 'shine' || rawId === 'shine_barbershop') {
                    matchedTenant = { id: 'shine_barbershop', shopName: 'Shine Barbershop' };
                } else {
                    const fromCatalog = (window.BARBERSHOPS_DATA || []).find(b => b.id === rawId);
                    matchedTenant = {
                        id: rawId.replace(/\s+/g, '_'),
                        shopName: selectedOwnerShopName || (fromCatalog ? fromCatalog.name : rawId)
                    };
                }
            }

            if (!matchedTenant) {
                errEl.textContent = 'Неверный ID или PIN-код (по умолчанию: 7777)';
                errEl.style.display = 'block';
                return;
            }

            // Save shopName in tenant settings if selected from catalog
            if (matchedTenant.shopName) {
                const sKey = matchedTenant.id + '_barber_settings';
                try {
                    const cur = JSON.parse(localStorage.getItem(sKey) || '{}');
                    if (!cur.shopName) {
                        cur.shopName = matchedTenant.shopName;
                        localStorage.setItem(sKey, JSON.stringify(cur));
                    }
                } catch (e) {}
            }

            // Save persistent session (no GPS requested!)
            window.BarberMobileBridge.saveSession({
                role: 'owner',
                tenantId: matchedTenant.id,
                shopName: matchedTenant.shopName
            });

            window.location.href = `admin.html?id=${encodeURIComponent(matchedTenant.id)}`;
        }

        // 4. ROLE 3: SOLO MASTER LOGIN
        function submitMasterLogin() {
            const rawId = document.getElementById('solo-id-input').value.trim().toLowerCase().replace(/\s+/g, '_');
            const masterName = document.getElementById('solo-name-input').value.trim() || 'Топ-Мастер';
            const pin = document.getElementById('solo-pin-input').value.trim();
            const errEl = document.getElementById('solo-err');

            if (!rawId || pin.length < 4) {
                errEl.style.display = 'block';
                return;
            }

            // Check saved PIN for this solo master or allow default 7777 / first-time PIN setup
            const pinKey = `solo_pin_${rawId}`;
            const savedPin = localStorage.getItem(pinKey);
            if (savedPin && savedPin !== pin && pin !== '7777') {
                errEl.textContent = 'Неверный PIN-код для этого ID мастера!';
                errEl.style.display = 'block';
                return;
            }
            if (!savedPin) {
                localStorage.setItem(pinKey, pin);
            }

            window.BarberMobileBridge.saveSession({
                role: 'master',
                tenantId: rawId,
                masterId: rawId,
                masterName: masterName,
                shopName: masterName
            });

            window.location.href = `barber.html?id=${encodeURIComponent(rawId)}`;
        }
    </script>
</body>
