<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0f4f9">
    <title>Переход к онлайн-записи | BarberMap KG</title>
    <script src="assets/mobile-bridge.js?v=9"></script>
    <style>
        body {
            background: #e9ecef;
            color: #0c192c;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #d5e2f0;
            border-top-color: #7a1c2d;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 style="font-size:1.15rem;font-weight:800;margin:0 0 6px;color:#0c192c;">Открываем онлайн-запись...</h2>
    <p style="color:#6c7a8e;font-size:0.88rem;font-weight:600;margin:0;">Секунду, перенаправляем в филиал</p>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || params.get('shop') || 'markazibarbershop1';
            const solo = params.get('solo') ? '&solo=1' : '';

            // Save Deferred Deep Link ID in persistent storage in case app is installed after
            try {
                localStorage.setItem('barber_deferred_deeplink_id', id);
                localStorage.setItem('tenant_id', id);
            } catch (e) {}

            // Immediately route past Role Selection & Map directly into index.html?id={barbershop_id}
            const targetUrl = `index.html?id=${encodeURIComponent(id)}${solo}`;
            window.location.replace(targetUrl);
        })();
    </script>
</body>
</html>
