<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06141B">
    <title>Переход к онлайн-записи...</title>
    <script src="assets/mobile-bridge.js"></script>
    <style>
        body {
            background: #06141B;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(251, 191, 36, 0.2);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 style="font-size:1.15rem;margin:0 0 6px;">Открываем онлайн-запись...</h2>
    <p style="color:#9BA8AB;font-size:0.88rem;margin:0;">Секунду, перенаправляем в филиал</p>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || params.get('shop') || 'markazibarbershop1';
            const solo = params.get('solo') ? '&solo=1' : '';

            // Save Deferred Deep Link ID in persistent storage in case app is installed after
            try {
                localStorage.setItem('barber_deferred_deeplink_id', id);
                localStorage.setItem('tenant_id', id);
            } catch (e) {}

            // Immediately route past Role Selection & Map directly into index.html?id={barbershop_id}
            const targetUrl = `index.html?id=${encodeURIComponent(id)}${solo}`;
            window.location.replace(targetUrl);
        })();
    </script>
</body>
</html>
